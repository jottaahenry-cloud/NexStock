<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Estoque de Roupas</title>
<style>
  :root {
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --bg: #f8fafc;
    --text: #1e293b;
    --text-light: #64748b;
    --white: #ffffff;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #10b981;
    --border: #e2e8f0;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }
  body { background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  header {
    background: linear-gradient(135deg, var(--primary), #7c3aed);
    color: white; padding: 24px 40px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
  }
  header h1 { font-size: 26px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  header p { opacity: 0.9; font-size: 14px; margin-top: 4px; }

  nav {
    display: flex; gap: 8px; padding: 0 40px;
    background: var(--white); border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none; border: none; padding: 16px 20px;
    font-size: 15px; font-weight: 500; cursor: pointer; color: var(--text-light);
    border-bottom: 3px solid transparent; transition: all 0.2s;
  }
  nav button:hover { color: var(--primary); }
  nav button.ativo { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }

  main { padding: 32px 40px; max-width: 1300px; margin: 0 auto; }
  .secao { display: none; animation: fadeIn 0.3s ease; }
  .secao.ativa { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .topo-secao {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px;
  }
  .topo-secao h2 { font-size: 24px; font-weight: 700; color: var(--text); }

  .btn {
    background: var(--primary); color: white; border: none;
    padding: 10px 20px; border-radius: 8px; cursor: pointer;
    font-size: 14px; font-weight: 600; transition: all 0.2s;
    display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-sec { background: var(--text-light); }
  .btn-sec:hover { background: #475569; }
  .btn-edit { background: var(--warning); padding: 8px 14px; font-size: 13px; }
  .btn-edit:hover { background: #d97706; }
  .btn-del { background: var(--danger); padding: 8px 14px; font-size: 13px; }
  .btn-del:hover { background: #dc2626; }
  .btn-sm { padding: 6px 12px; font-size: 14px; border-radius: 6px; display: flex; align-items: center; justify-content: center; }

  table {
    width: 100%; border-collapse: separate; border-spacing: 0;
    background: var(--white); border-radius: 12px; overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.03);
    border: 1px solid var(--border);
  }
  th, td { padding: 16px 20px; text-align: left; border-bottom: 1px solid var(--border); }
  th { background: #f1f5f9; font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-light); letter-spacing: 0.5px; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f8fafc; }
  td { font-size: 14px; color: var(--text); }

  .badge { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
  .badge-ativo { background: #d1fae5; color: #065f46; }
  .badge-inativo { background: #fee2e2; color: #991b1b; }

  /* Modais */
  .modal-fundo {
    display: none; position: fixed; inset: 0;
    background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
    z-index: 100; align-items: center; justify-content: center;
  }
  .modal-fundo.aberto { display: flex; }
  .modal {
    background: var(--white); border-radius: 16px; padding: 32px;
    width: 90%; max-width: 500px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
    animation: slideUp 0.3s ease; max-height: 90vh; overflow-y: auto;
  }
  @keyframes slideUp { from { opacity: 0; transform: translateY(20px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .modal h3 { margin-bottom: 24px; font-size: 20px; color: var(--text); }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
  
  /* Inputs normais */
  .form-group input, .form-group select {
    width: 100%; padding: 12px 14px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    transition: all 0.2s; background: var(--white); color: var(--text);
  }
  .form-group input:focus, .form-group select:focus {
    outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
  }

  /* Input com botão ao lado */
  .input-group { display: flex; gap: 8px; }
  .input-group select {
    flex: 1; width: auto; 
  }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .modal-acoes { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    padding: 16px 24px; border-radius: 10px; color: white;
    font-weight: 500; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    opacity: 0; transform: translateY(20px); transition: all 0.3s;
    z-index: 200;
  }
  .toast.visivel { opacity: 1; transform: translateY(0); }
  .toast.sucesso { background: var(--success); }
  .toast.erro { background: var(--danger); }

  .vazio { text-align: center; padding: 40px; color: var(--text-light); font-style: italic; }
</style>
</head>
<body>

<header>
  <h1>👗 Estoque de Roupas</h1>
  <p>Sistema integrado de gestão</p>
</header>

<nav>
  <button data-secao="produtos" class="ativo">Produtos</button>
  <button data-secao="categorias">Categorias</button>
  <button data-secao="fornecedores">Fornecedores</button>
</nav>

<main>
  <!-- ================= PRODUTOS ================= -->
  <section id="secao-produtos" class="secao ativa">
    <div class="topo-secao">
      <h2>Produtos</h2>
      <button class="btn" onclick="abrirModalProduto()">+ Novo Produto</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Nome</th><th>Preço</th><th>Qtd</th>
          <th>Status</th><th>Fornecedor</th><th>Categoria</th><th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-produtos"></tbody>
    </table>
  </section>

  <!-- ================= CATEGORIAS ================= -->
  <section id="secao-categorias" class="secao">
    <div class="topo-secao">
      <h2>Categorias</h2>
      <button class="btn" onclick="abrirModalCategoria()">+ Nova Categoria</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>Ações</th></tr></thead>
      <tbody id="tabela-categorias"></tbody>
    </table>
  </section>

  <!-- ================= FORNECEDORES ================= -->
  <section id="secao-fornecedores" class="secao">
    <div class="topo-secao">
      <h2>Fornecedores</h2>
      <button class="btn" onclick="abrirModalFornecedor()">+ Novo Fornecedor</button>
    </div>
    <table>
      <thead><tr><th>ID</th><th>Nome</th><th>CNPJ</th><th>Ações</th></tr></thead>
      <tbody id="tabela-fornecedores"></tbody>
    </table>
  </section>
</main>

<!-- ================= MODAL PRODUTO ================= -->
<div class="modal-fundo" id="modal-produto">
  <div class="modal">
    <h3 id="titulo-modal-produto">Novo Produto</h3>
    <input type="hidden" id="produto-id">
    
    <div class="form-group">
      <label>Nome do Produto</label>
      <input id="produto-nome" type="text" placeholder="Ex: Camiseta Básica">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>Preço (R$)</label>
        <input id="produto-preco" type="number" step="0.01" min="0" placeholder="0.00">
      </div>
      <div class="form-group">
        <label>Quantidade</label>
        <input id="produto-quantidade" type="number" min="0" placeholder="0">
      </div>
    </div>

    <div class="form-group">
      <label>Status</label>
      <select id="produto-ativo">
        <option value="1">Ativo</option>
        <option value="0">Inativo</option>
      </select>
    </div>

    <!-- Fornecedor com atalho -->
    <div class="form-group">
      <label>Fornecedor</label>
      <div class="input-group">
        <select id="produto-fornecedor"></select>
        <button class="btn btn-sm" onclick="abrirModalFornecedorAtalho()" title="Cadastrar novo fornecedor">+</button>
      </div>
    </div>

    <!-- Categoria com atalho -->
    <div class="form-group">
      <label>Categoria</label>
      <div class="input-group">
        <select id="produto-categoria"></select>
        <button class="btn btn-sm" onclick="abrirModalCategoriaAtalho()" title="Cadastrar nova categoria">+</button>
      </div>
    </div>

    <div class="modal-acoes">
      <button class="btn btn-sec" onclick="fecharModal('modal-produto')">Cancelar</button>
      <button class="btn" onclick="salvarProduto()">Salvar Produto</button>
    </div>
  </div>
</div>

<!-- ================= MODAL CATEGORIA ================= -->
<div class="modal-fundo" id="modal-categoria" style="z-index: 110;">
  <div class="modal" style="max-width: 400px;">
    <h3 id="titulo-modal-categoria">Nova Categoria</h3>
    <input type="hidden" id="categoria-id">
    <div class="form-group">
      <label>Nome da Categoria</label>
      <input id="categoria-nome" type="text" placeholder="Ex: Camisetas">
    </div>
    <div class="modal-acoes">
      <button class="btn btn-sec" onclick="fecharModal('modal-categoria')">Cancelar</button>
      <button class="btn" onclick="salvarCategoria()">Salvar</button>
    </div>
  </div>
</div>

<!-- ================= MODAL FORNECEDOR ================= -->
<div class="modal-fundo" id="modal-fornecedor" style="z-index: 110;">
  <div class="modal" style="max-width: 400px;">
    <h3 id="titulo-modal-fornecedor">Novo Fornecedor</h3>
    <input type="hidden" id="fornecedor-id">
    <div class="form-group">
      <label>Nome do Fornecedor</label>
      <input id="fornecedor-nome" type="text" placeholder="Ex: Tecidos Silva">
    </div>
    <div class="form-group">
      <label>CNPJ</label>
      <input id="fornecedor-cnpj" type="text" placeholder="00.000.000/0000-00">
    </div>
    <div class="modal-acoes">
      <button class="btn btn-sec" onclick="fecharModal('modal-fornecedor')">Cancelar</button>
      <button class="btn" onclick="salvarFornecedor()">Salvar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '';

document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('ativo'));
    document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativo'));
    btn.classList.add('ativo');
    document.getElementById('secao-' + btn.dataset.secao).classList.add('ativo');
  });
});

function toast(msg, tipo = 'sucesso') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + tipo + ' visivel';
  setTimeout(() => el.classList.remove('visivel'), 3000);
}

function fecharModal(id) { document.getElementById(id).classList.remove('aberto'); }

// Preenche selects e mantém o valor atual se houver
function preencherSelect(selectId, dados, campoValor, campoTexto) {
  const select = document.getElementById(selectId);
  const valorAtual = select.value; 
  select.innerHTML = '<option value="">-- Selecione --</option>' +
    dados.map(d => `<option value="${d[campoValor]}">${d[campoTexto]}</option>`).join('');
  if (valorAtual) select.value = valorAtual;
}

async function carregarFornecedores() {
  const res = await fetch(API + '/fornecedores');
  const dados = await res.json();
  const tbody = document.getElementById('tabela-fornecedores');
  
  if (dados.length === 0) {
    tbody.innerHTML = '<tr><td colspan="4" class="vazio">Nenhum fornecedor cadastrado</td></tr>';
  } else {
    tbody.innerHTML = dados.map(f => `
      <tr>
        <td>${f.id}</td>
        <td>${f.nome}</td>
        <td>${f.cnpj}</td>
        <td>
          <button class="btn btn-edit" onclick='editarFornecedor(${JSON.stringify(f)})'>Editar</button>
          <button class="btn btn-del" onclick="removerFornecedor(${f.id})">Excluir</button>
        </td>
      </tr>`).join('');
  }
  preencherSelect('produto-fornecedor', dados, 'id', 'nome');
  return dados;
}

async function carregarCategorias() {
  const res = await fetch(API + '/categorias');
  const dados = await res.json();
  const tbody = document.getElementById('tabela-categorias');

  if (dados.length === 0) {
    tbody.innerHTML = '<tr><td colspan="3" class="vazio">Nenhuma categoria cadastrada</td></tr>';
  } else {
    tbody.innerHTML = dados.map(c => `
      <tr>
        <td>${c.id}</td>
        <td>${c.nome}</td>
        <td>
          <button class="btn btn-edit" onclick='editarCategoria(${JSON.stringify(c)})'>Editar</button>
          <button class="btn btn-del" onclick="removerCategoria(${c.id})">Excluir</button>
        </td>
      </tr>`).join('');
  }
  preencherSelect('produto-categoria', dados, 'id', 'nome');
  return dados;
}

async function carregarProdutos() {
  const [produtos, fornecedores, categorias] = await Promise.all([
    fetch(API + '/produtos').then(r => r.json()),
    fetch(API + '/fornecedores').then(r => r.json()),
    fetch(API + '/categorias').then(r => r.json())
  ]);

  const nomeFornecedor = id => (fornecedores.find(f => f.id === id) || {}).nome || '-';
  const nomeCategoria = id => (categorias.find(c => c.id === id) || {}).nome || '-';

  const tbody = document.getElementById('tabela-produtos');
  if (produtos.length === 0) {
    tbody.innerHTML = '<tr><td colspan="8" class="vazio">Nenhum produto cadastrado</td></tr>';
  } else {
    tbody.innerHTML = produtos.map(p => `
      <tr>
        <td>${p.id}</td>
        <td>${p.nome}</td>
        <td>R$ ${Number(p.preco).toFixed(2).replace('.', ',')}</td>
        <td>${p.quantidade}</td>
        <td><span class="badge ${p.ativo ? 'badge-ativo' : 'badge-inativo'}">${p.ativo ? 'Ativo' : 'Inativo'}</span></td>
        <td>${nomeFornecedor(p.fornecedor_id)}</td>
        <td>${nomeCategoria(p.categoria_id)}</td>
        <td>
          <button class="btn btn-edit" onclick='editarProduto(${JSON.stringify(p)})'>Editar</button>
          <button class="btn btn-del" onclick="removerProduto(${p.id})">Excluir</button>
        </td>
      </tr>`).join('');
  }
}

// ============ PRODUTO ============
async function abrirModalProduto() {
  document.getElementById('titulo-modal-produto').textContent = 'Novo Produto';
  document.getElementById('produto-id').value = '';
  document.getElementById('produto-nome').value = '';
  document.getElementById('produto-preco').value = '';
  document.getElementById('produto-quantidade').value = '';
  document.getElementById('produto-ativo').value = '1';
  
  await Promise.all([carregarFornecedores(), carregarCategorias()]);
  document.getElementById('modal-produto').classList.add('aberto');
}

function editarProduto(p) {
  document.getElementById('titulo-modal-produto').textContent = 'Editar Produto';
  document.getElementById('produto-id').value = p.id;
  document.getElementById('produto-nome').value = p.nome;
  document.getElementById('produto-preco').value = p.preco;
  document.getElementById('produto-quantidade').value = p.quantidade;
  document.getElementById('produto-ativo').value = p.ativo ? '1' : '0';
  
  Promise.all([carregarFornecedores(), carregarCategorias()]).then(() => {
    document.getElementById('produto-fornecedor').value = p.fornecedor_id;
    document.getElementById('produto-categoria').value = p.categoria_id;
    document.getElementById('modal-produto').classList.add('aberto');
  });
}

async function salvarProduto() {
  const id = document.getElementById('produto-id').value;
  const dados = {
    nome: document.getElementById('produto-nome').value.trim(),
    preco: parseFloat(document.getElementById('produto-preco').value),
    quantidade: parseInt(document.getElementById('produto-quantidade').value),
    ativo: parseInt(document.getElementById('produto-ativo').value),
    fornecedor_id: parseInt(document.getElementById('produto-fornecedor').value),
    categoria_id: parseInt(document.getElementById('produto-categoria').value)
  };

  if (!dados.nome || isNaN(dados.preco) || isNaN(dados.quantidade) || 
      isNaN(dados.fornecedor_id) || isNaN(dados.categoria_id)) {
    toast('Preencha todos os campos corretamente.', 'erro');
    return;
  }

  const url = id ? `/produtos/${id}` : '/produtos';
  const metodo = id ? 'PUT' : 'POST';

  try {
    const res = await fetch(API + url, {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
    if (!res.ok) throw new Error();
    fecharModal('modal-produto');
    toast(id ? 'Produto atualizado com sucesso!' : 'Produto criado com sucesso!');
    carregarProdutos();
  } catch {
    toast('Erro ao salvar produto', 'erro');
  }
}

async function removerProduto(id) {
  if (!confirm('Tem certeza que deseja remover este produto?')) return;
  try {
    await fetch(API + `/produtos/${id}`, { method: 'DELETE' });
    toast('Produto removido!');
    carregarProdutos();
  } catch { toast('Erro ao remover', 'erro'); }
}

// ============ CATEGORIA ============
function abrirModalCategoria() {
  document.getElementById('titulo-modal-categoria').textContent = 'Nova Categoria';
  document.getElementById('categoria-id').value = '';
  document.getElementById('categoria-nome').value = '';
  document.getElementById('modal-categoria').classList.add('aberto');
}

function abrirModalCategoriaAtalho() {
  abrirModalCategoria();
}

function editarCategoria(c) {
  document.getElementById('titulo-modal-categoria').textContent = 'Editar Categoria';
  document.getElementById('categoria-id').value = c.id;
  document.getElementById('categoria-nome').value = c.nome;
  document.getElementById('modal-categoria').classList.add('aberto');
}

async function salvarCategoria() {
  const id = document.getElementById('categoria-id').value;
  const nome = document.getElementById('categoria-nome').value.trim();
  if (!nome) { toast('Informe o nome da categoria', 'erro'); return; }

  const url = id ? `/categorias/${id}` : '/categorias';
  const metodo = id ? 'PUT' : 'POST';

  try {
    await fetch(API + url, {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ nome })
    });
    fecharModal('modal-categoria');
    toast(id ? 'Categoria atualizada!' : 'Categoria criada!');
    carregarCategorias();
    carregarProdutos();
  } catch { toast('Erro ao salvar categoria', 'erro'); }
}

async function removerCategoria(id) {
  if (!confirm('Remover esta categoria?')) return;
  try {
    await fetch(API + `/categorias/${id}`, { method: 'DELETE' });
    toast('Categoria removida!');
    carregarCategorias();
    carregarProdutos();
  } catch { toast('Erro ao remover', 'erro'); }
}

// ============ FORNECEDOR ============
function abrirModalFornecedor() {
  document.getElementById('titulo-modal-fornecedor').textContent = 'Novo Fornecedor';
  document.getElementById('fornecedor-id').value = '';
  document.getElementById('fornecedor-nome').value = '';
  document.getElementById('fornecedor-cnpj').value = '';
  document.getElementById('modal-fornecedor').classList.add('aberto');
}

function abrirModalFornecedorAtalho() {
  abrirModalFornecedor();
}

function editarFornecedor(f) {
  document.getElementById('titulo-modal-fornecedor').textContent = 'Editar Fornecedor';
  document.getElementById('fornecedor-id').value = f.id;
  document.getElementById('fornecedor-nome').value = f.nome;
  document.getElementById('fornecedor-cnpj').value = f.cnpj;
  document.getElementById('modal-fornecedor').classList.add('aberto');
}

async function salvarFornecedor() {
  const id = document.getElementById('fornecedor-id').value;
  const dados = {
    nome: document.getElementById('fornecedor-nome').value.trim(),
    cnpj: document.getElementById('fornecedor-cnpj').value.trim()
  };
  if (!dados.nome || !dados.cnpj) { toast('Preencha todos os campos', 'erro'); return; }

  const url = id ? `/fornecedores/${id}` : '/fornecedores';
  const metodo = id ? 'PUT' : 'POST';

  try {
    await fetch(API + url, {
      method: metodo,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(dados)
    });
    fecharModal('modal-fornecedor');
    toast(id ? 'Fornecedor atualizado!' : 'Fornecedor criado!');
    carregarFornecedores();
    carregarProdutos();
  } catch { toast('Erro ao salvar fornecedor', 'erro'); }
}

async function removerFornecedor(id) {
  if (!confirm('Remover este fornecedor?')) return;
  try {
    await fetch(API + `/fornecedores/${id}`, { method: 'DELETE' });
    toast('Fornecedor removido!');
    carregarFornecedores();
    carregarProdutos();
  } catch { toast('Erro ao remover', 'erro'); }
}

// ============ INICIALIZAÇÃO ============
(async function init() {
  await Promise.all([carregarFornecedores(), carregarCategorias()]);
  await carregarProdutos();
})();
</script>
</body>
</html>
