
{% extends "base.html" %}

{% block titulo %}Categorias | Sistema de Estoque{% endblock %}

{% block conteudo %}

<section class="pagina">

    <div class="pagina-cabecalho">
        <div>
            <h2>Categorias</h2>
            <p>Consulte e organize as categorias dos produtos.</p>
        </div>

        <a href="/pagina/categoria/nova" class="botao">
            Cadastrar categoria
        </a>
    </div>

    <div class="tabela-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Ações</th>
                </tr>
            </thead>

            <tbody id="lista-categorias">
                <tr>
                    <td colspan="3">Carregando categorias...</td>
                </tr>
            </tbody>
        </table>
    </div>

</section>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='categorias.js') }}"></script>
{% endblock %}
